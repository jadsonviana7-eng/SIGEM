mutation CreateProject($title: String!, $description: String, $deadline: Date) @auth(level: USER) {
  project_insert(data: {
    title: $title,
    description: $description,
    deadline: $deadline,
    ownerId_expr: "auth.uid"
  })
}

mutation CreateTask($title: String!, $status: String!, $projectId: UUID!, $description: String, $dueDate: Date) @auth(level: USER) {
  task_insert(data: {
    title: $title,
    status: $status,
    projectId: $projectId,
    description: $description,
    dueDate: $dueDate
  })
}

mutation AddComment($taskId: UUID!, $content: String!) @auth(level: USER) {
  comment_insert(data: {
    taskId: $taskId,
    content: $content,
    userId_expr: "auth.uid",
    createdAt_time: {now: true}
  })
}

query ListMyProjects @auth(level: USER) {
  projects(where: {ownerId: {eq_expr: "auth.uid"}}) {
    id
    title
    description
    deadline
  }
}